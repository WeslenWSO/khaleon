{% if site_config.system_active and site_config.system_url %}
<section class="py-12 bg-khaleon-light">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <a href="{{ site_config.system_url }}" target="_blank" rel="noopener noreferrer"
           class="group block max-w-3xl mx-auto bg-gradient-to-br from-khaleon-dark to-khaleon-cobalt rounded-2xl p-8 sm:p-10 shadow-xl hover:shadow-2xl transition-all hover:-translate-y-1 border border-khaleon-accent/20 card-glow">
            <div class="flex flex-col sm:flex-row sm:items-center gap-6">
                <div class="w-16 h-16 shrink-0 rounded-xl bg-khaleon-accent/15 flex items-center justify-center text-khaleon-accent group-hover:bg-khaleon-accent/25 transition-colors">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div class="flex-1">
                    <p class="text-khaleon-accent text-xs font-display uppercase tracking-widest mb-1">Plataforma online</p>
                    <h2 class="text-2xl font-bold text-white mb-2">{{ site_config.system_title }}</h2>
                    <p class="text-slate-300 text-sm leading-relaxed">
                        {{ site_config.system_description|default:"Acesse sua conta e gerencie suas finanças." }}
                    </p>
                </div>
                <div class="shrink-0">
                    <span class="inline-flex items-center gap-2 bg-khaleon-accent hover:bg-cyan-300 text-khaleon-dark px-6 py-3 rounded-lg font-semibold transition-colors shadow-lg shadow-khaleon-accent/30">
                        Entrar no sistema
                        <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                        </svg>
                    </span>
                </div>
            </div>
        </a>
    </div>
</section>
{% endif %}
